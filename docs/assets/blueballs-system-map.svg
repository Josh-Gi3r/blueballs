<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Blueballs open-source neobank system map</title>
  <desc id="desc">The demonstrator website connects to a 174-operation banking API and canonical FX engine. Both use replaceable operator-selected adapters; named providers are not connected by default.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0b1930"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="1" stop-color="#24c8ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#705cff"/>
      <stop offset="1" stop-color="#3b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52b6ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" rx="36" fill="url(#bg)"/>
  <g opacity=".22" stroke="#2c75b7" fill="none">
    <path d="M0 92H1600M0 628H1600"/>
    <circle cx="800" cy="360" r="315"/>
    <circle cx="800" cy="360" r="255"/>
  </g>
  <text x="92" y="90" fill="#f5f9ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">One forkable stack. Clear boundaries.</text>
  <text x="92" y="128" fill="#8fa9c7" font-family="Inter,Arial,sans-serif" font-size="20">Demo surfaces explain the system; APIs, contracts and engines are the product.</text>

  <g filter="url(#shadow)">
    <rect x="85" y="215" width="310" height="285" rx="28" fill="#0f213c" stroke="#284a70"/>
    <rect x="85" y="215" width="310" height="8" rx="4" fill="url(#blue)"/>
    <text x="120" y="275" fill="#7ecbff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">DEMONSTRATOR</text>
    <text x="120" y="321" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Website</text>
    <text x="120" y="365" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="19">Home · Products · FX</text>
    <text x="120" y="395" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="19">Cards · Ecosystem · API</text>
    <rect x="120" y="430" width="214" height="38" rx="19" fill="#142f52"/>
    <text x="139" y="455" fill="#91d8ff" font-family="Inter,Arial,sans-serif" font-size="15">labelled demos + research</text>

    <rect x="500" y="178" width="360" height="350" rx="28" fill="#10243f" stroke="#2a5e93"/>
    <rect x="500" y="178" width="360" height="8" rx="4" fill="url(#blue)"/>
    <text x="538" y="240" fill="#7ecbff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">BANKING FOUNDATION</text>
    <text x="538" y="286" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Banking API</text>
    <text x="538" y="328" fill="#c8d8e9" font-family="Inter,Arial,sans-serif" font-size="19">174 operations</text>
    <text x="538" y="360" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">accounts · cards · transfers</text>
    <text x="538" y="390" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">onboarding · credit · business</text>
    <text x="538" y="420" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">ledger · events · webhooks</text>
    <rect x="538" y="455" width="282" height="42" rx="21" fill="#12345a"/>
    <text x="559" y="482" fill="#8fdbff" font-family="Inter,Arial,sans-serif" font-size="15">Node SQLite + Durable Objects</text>

    <rect x="960" y="178" width="360" height="350" rx="28" fill="#151f42" stroke="#4c54a4"/>
    <rect x="960" y="178" width="360" height="8" rx="4" fill="url(#violet)"/>
    <text x="998" y="240" fill="#afa7ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">FLAGSHIP ENGINE</text>
    <text x="998" y="286" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Canonical FX</text>
    <text x="998" y="328" fill="#c8d8e9" font-family="Inter,Arial,sans-serif" font-size="19">node · SDK · contracts</text>
    <text x="998" y="360" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">policy · pricing · liquidity</text>
    <text x="998" y="390" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">reserve · execute · reconcile</text>
    <text x="998" y="420" fill="#a9bdd4" font-family="Inter,Arial,sans-serif" font-size="18">fiat + token mixed finality</text>
    <rect x="998" y="455" width="272" height="42" rx="21" fill="#27295b"/>
    <text x="1019" y="482" fill="#c0bbff" font-family="Inter,Arial,sans-serif" font-size="15">fails closed without execution</text>

    <rect x="1372" y="215" width="143" height="285" rx="28" fill="#10243a" stroke="#35617f"/>
    <rect x="1372" y="215" width="143" height="8" rx="4" fill="#49d0c7"/>
    <text x="1400" y="274" fill="#8ae6df" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ADAPTERS</text>
    <text x="1400" y="318" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Your</text>
    <text x="1400" y="346" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">providers</text>
    <text x="1400" y="392" fill="#9fb9ca" font-family="Inter,Arial,sans-serif" font-size="15">banks</text>
    <text x="1400" y="416" fill="#9fb9ca" font-family="Inter,Arial,sans-serif" font-size="15">rails</text>
    <text x="1400" y="440" fill="#9fb9ca" font-family="Inter,Arial,sans-serif" font-size="15">custody</text>
    <text x="1400" y="464" fill="#9fb9ca" font-family="Inter,Arial,sans-serif" font-size="15">compliance</text>
  </g>

  <g stroke="#52b6ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M395 355H485"/>
    <path d="M860 355H945"/>
    <path d="M1320 355H1358"/>
  </g>
  <g fill="#7698b9" font-family="Inter,Arial,sans-serif" font-size="14">
    <text x="410" y="338">sandbox HTTP</text>
    <text x="872" y="338">policy + FX</text>
    <text x="1329" y="338" transform="rotate(-90 1329 338)">contract</text>
  </g>

  <rect x="85" y="588" width="1430" height="66" rx="20" fill="#0b1a2e" stroke="#203d5a"/>
  <circle cx="123" cy="621" r="8" fill="#4ed0c8"/>
  <text x="146" y="628" fill="#d9e7f5" font-family="Inter,Arial,sans-serif" font-size="17">Reference software, not a licensed bank</text>
  <circle cx="565" cy="621" r="8" fill="#4ed0c8"/>
  <text x="588" y="628" fill="#d9e7f5" font-family="Inter,Arial,sans-serif" font-size="17">Provider-neutral core</text>
  <circle cx="875" cy="621" r="8" fill="#4ed0c8"/>
  <text x="898" y="628" fill="#d9e7f5" font-family="Inter,Arial,sans-serif" font-size="17">Dakota + Bridge descriptors: no HTTP calls</text>
</svg>

