[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Per-commit gate: deliberately strong but bounded so every branch change receives timely evidence.
[profile.ci]
fuzz = { runs = 20000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }

# Milestone/release stress campaign. This is intentionally expensive and is not the normal branch gate.
[profile.stress]
fuzz = { runs = 100000 }
invariant = { runs = 5000, depth = 250, fail_on_revert = false }
