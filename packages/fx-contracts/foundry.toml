[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.ci]
fuzz = { runs = 50000 }
invariant = { runs = 5000, depth = 250, fail_on_revert = false }
