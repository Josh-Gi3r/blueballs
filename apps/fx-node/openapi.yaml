openapi: 3.1.0
info:
  title: Blueballs FX Node
  version: 0.4.0
  description: |
    Canonical REST contract for the self-hostable Blueballs FX runtime.

    Blueballs composes institution policy, private and institutional liquidity,
    reference pricing, principal risk, all-leg reservation, explicit fiat finality,
    and adapter-driven execution behind one API. Public inspection and preview
    operations are anonymous. Client bearer credentials create and submit market
    activity. A distinct operator bearer credential controls authoritative
    reconciliation and external settlement evidence.

    The bundled reference monetary profile is deterministic and isolated from
    live provider balances. Production deployments supply their own reserve,
    custody, liquidity and settlement infrastructure through runtime adapters.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8788
    description: Local Blueballs FX node
security:
  - clientBearerAuth: []
tags:
  - name: Runtime
  - name: Public trade
  - name: Monetary Engine
  - name: Liquidity
  - name: Orders
  - name: Quotes
  - name: Fiat
  - name: Operations
paths:
  /health:
    get:
      tags: [Runtime]
      security: []
      summary: Check node availability and source parity
      responses:
        '200':
          description: Node is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, source_commit]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: blueballs-fx-node }
                  runtime: { type: string }
                  source_commit: { type: string }
  /openapi.yaml:
    get:
      tags: [Runtime]
      security: []
      summary: Download this OpenAPI contract
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }
  /v2/fx/reference/status:
    get:
      tags: [Runtime]
      security: []
      summary: Inspect runtime capabilities and composition
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/policy:
    get:
      tags: [Runtime]
      security: []
      summary: Inspect active institution policy
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/market:
    get:
      tags: [Runtime]
      security: []
      summary: Inspect current reference-market eligibility and pricing state
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/scenario:
    get:
      tags: [Runtime]
      security: []
      summary: List deterministic reference scenarios
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Runtime]
      summary: Apply a deterministic reference scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/liquidity:
    get:
      tags: [Liquidity]
      security: []
      summary: Inspect policy-eligible source slices without reserving them
      parameters:
        - $ref: '#/components/parameters/InputAsset'
        - $ref: '#/components/parameters/OutputAsset'
        - name: exactOutput
          in: query
          schema: { $ref: '#/components/schemas/AtomicAmount' }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/settlement-route:
    get:
      tags: [Runtime]
      security: []
      summary: Inspect mixed-finality settlement-route evidence
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/trades/preview:
    post:
      tags: [Public trade]
      security: []
      summary: Preview the public reference trade without reserving liquidity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicTradeRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/trades:
    post:
      tags: [Public trade]
      summary: Reserve the public reference trade across every selected source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicTradeRequest' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/trades/{tradeId}:
    parameters:
      - $ref: '#/components/parameters/TradeId'
    get:
      tags: [Public trade]
      summary: Retrieve a reserved public reference trade
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Public trade]
      summary: Release a still-reserved public reference trade
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/trades/{tradeId}/execute:
    post:
      tags: [Public trade]
      summary: Submit a reserved trade through the configured execution adapter
      responses:
        '202': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/health:
    get:
      tags: [Monetary Engine]
      security: []
      summary: Inspect segregated reserve coverage and risk capital
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/instruments:
    get:
      tags: [Monetary Engine]
      security: []
      summary: List configured reference monetary instruments
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/remittance/preview:
    post:
      tags: [Monetary Engine]
      security: []
      summary: Preview the canonical BRL to EUR reference corridor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inputAmount]
              properties:
                inputAmount: { $ref: '#/components/schemas/AtomicAmount' }
                inputCurrency: { type: string, default: BRL }
                outputCurrency: { type: string, default: EUR }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/reserves:
    post:
      tags: [Monetary Engine]
      summary: Record a pending external reserve deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reserveCurrency, amount, providerRef]
              properties:
                reserveCurrency: { type: string }
                amount: { $ref: '#/components/schemas/AtomicAmount' }
                providerRef: { type: string }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/reserves/{depositId}:
    get:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/DepositId'
      summary: Retrieve one reserve deposit
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/reserves/{depositId}/settle:
    post:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/DepositId'
      summary: Mark external reserve funds as settled in the reference monetary profile
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/risk-capital:
    post:
      tags: [Monetary Engine]
      summary: Set separately funded FX risk capital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reserveCurrency, amount]
              properties:
                reserveCurrency: { type: string }
                amount: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/instruments/{instrumentCode}/mint:
    post:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/InstrumentCode'
      summary: Create reference instrument supply against free settled reserve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, beneficiaryRef]
              properties:
                amount: { $ref: '#/components/schemas/AtomicAmount' }
                beneficiaryRef: { type: string }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/instruments/{instrumentCode}/redeem:
    post:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/InstrumentCode'
      summary: Redeem reference instrument supply against settled reserve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, holderRef]
              properties:
                amount: { $ref: '#/components/schemas/AtomicAmount' }
                holderRef: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/receipts:
    post:
      tags: [Monetary Engine]
      summary: Create an expiring purpose-bound reserve receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reserveCurrency, amount, beneficiaryRef, purpose, expiresAt]
              properties:
                reserveCurrency: { type: string }
                amount: { $ref: '#/components/schemas/AtomicAmount' }
                beneficiaryRef: { type: string }
                purpose: { type: string }
                expiresAt: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/receipts/{receiptId}:
    get:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      summary: Retrieve one reserve receipt
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/receipts/{receiptId}/consume:
    post:
      tags: [Monetary Engine]
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      summary: Consume an active reserve receipt once
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/reference/monetary/events:
    get:
      tags: [Monetary Engine]
      summary: List monetary state-transition evidence
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/depth:
    get:
      tags: [Liquidity]
      summary: Read aggregate private-market depth
      parameters:
        - $ref: '#/components/parameters/InputAsset'
        - $ref: '#/components/parameters/OutputAsset'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/orders:
    post:
      tags: [Orders]
      summary: Submit a signed maker order for policy admission
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Orders]
      summary: List one maker's private orders
      parameters:
        - name: maker
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/orders/{orderHash}/cancel:
    post:
      tags: [Orders]
      summary: Remove an order from off-chain matching and record invalidation evidence
      parameters:
        - name: orderHash
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                onChainInvalidated: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/quotes:
    post:
      tags: [Quotes]
      summary: Reserve an exact-output route across policy-approved liquidity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/quotes/{quoteId}:
    get:
      tags: [Quotes]
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      summary: Retrieve quote lifecycle state
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/quotes/{quoteId}/execute:
    post:
      tags: [Quotes]
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      summary: Submit a reserved quote through the configured execution adapter
      responses:
        '202': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/routes/{routeId}:
    get:
      tags: [Quotes]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      summary: Inspect route allocation and lifecycle state
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/intents:
    post:
      tags: [Fiat]
      summary: Create a typed fiat settlement intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiatIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/intents/{intentId}:
    get:
      tags: [Fiat]
      parameters:
        - $ref: '#/components/parameters/IntentId'
      summary: Retrieve a fiat intent
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/intents/{intentId}/reserve:
    post:
      tags: [Fiat]
      parameters:
        - $ref: '#/components/parameters/IntentId'
      summary: Reserve a fiat intent
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/intents/{intentId}/submit:
    post:
      tags: [Fiat]
      parameters:
        - $ref: '#/components/parameters/IntentId'
      summary: Record external fiat submission without declaring settlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [submissionRef]
              properties:
                submissionRef: { type: string }
      responses:
        '202': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/attestations:
    post:
      tags: [Fiat, Operations]
      security:
        - operatorBearerAuth: []
      summary: Bind authoritative external fiat payment evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/fiat/intents/{intentId}/settle:
    post:
      tags: [Fiat, Operations]
      security:
        - operatorBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentId'
      summary: Settle a verified fiat intent from authoritative evidence
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                eventId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/ops/quotes/{quoteId}/confirmed:
    post:
      tags: [Operations]
      security:
        - operatorBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      summary: Reconcile a submitted quote as confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [eventId]
              properties:
                eventId: { type: string }
                fills: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v2/fx/ops/quotes/{quoteId}/failed:
    post:
      tags: [Operations]
      security:
        - operatorBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      summary: Reconcile a submitted quote as failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                eventId: { type: string }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    clientBearerAuth:
      type: http
      scheme: bearer
      description: Client or integration credential for authenticated market operations.
    operatorBearerAuth:
      type: http
      scheme: bearer
      description: Distinct deployment operator credential for authoritative finality and settlement evidence.
  parameters:
    InputAsset:
      name: inputAsset
      in: query
      required: true
      schema: { type: string }
    OutputAsset:
      name: outputAsset
      in: query
      required: true
      schema: { type: string }
    TradeId:
      name: tradeId
      in: path
      required: true
      schema: { type: string }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: string }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string }
    IntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string }
    DepositId:
      name: depositId
      in: path
      required: true
      schema: { type: string }
    InstrumentCode:
      name: instrumentCode
      in: path
      required: true
      schema: { type: string }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string }
  schemas:
    AtomicAmount:
      type: string
      description: Positive integer atomic units encoded as a decimal string.
    PublicTradeRequest:
      type: object
      additionalProperties: false
      required: [inputAmount]
      properties:
        inputAmount: { type: string }
        from: { type: string, default: BRL }
        to: { type: string, default: EUR }
        expiresInMs: { type: integer, minimum: 1, maximum: 120000, default: 30000 }
        participantId: { type: string }
        accountRef: { type: string }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [inputAsset, outputAsset, exactOutput]
      properties:
        inputAsset: { type: string }
        outputAsset: { type: string }
        exactOutput: { $ref: '#/components/schemas/AtomicAmount' }
        expiresInMs: { type: integer, minimum: 1 }
        participantId: { type: string }
        accountRef: { type: string }
    FiatIntentRequest:
      type: object
      additionalProperties: true
      required:
        - intentId
        - routeId
        - edgeId
        - edgeType
        - finalityClass
        - payerParticipantId
        - payeeParticipantId
        - payerAccountRef
        - payeeAccountRef
        - currency
        - amount
        - rail
        - providerId
        - policyAuthorizationId
        - createdAt
        - expiresAt
        - nonce
      properties:
        intentId: { type: string }
        routeId: { type: string }
        edgeId: { type: string }
        edgeType: { type: string }
        finalityClass: { type: string }
        payerParticipantId: { type: string }
        payeeParticipantId: { type: string }
        payerAccountRef: { type: string }
        payeeAccountRef: { type: string }
        currency: { type: string }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        rail: { type: string }
        providerId: { type: string }
        policyAuthorizationId: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        nonce: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    GenericObject:
      type: object
      additionalProperties: true
    GenericList:
      type: object
      additionalProperties: true
      required: [object, data]
      properties:
        object: { type: string }
        data: { type: array, items: {} }
  responses:
    ObjectResponse:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericObject' }
    ListResponse:
      description: Successful list operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericList' }
    Error:
      description: Structured FX node error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
