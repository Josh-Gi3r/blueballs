name: Implementation
description: Talk about integrating, adapting, deploying or operating Blueballs for a real product.
title: "[Implementation] "
body:
  - type: markdown
    attributes:
      value: |
        ## Implement Blueballs
        Blueballs is MIT licensed and free to fork. Use this route when you want the project involved in architecture, integration, provider adapters, deployment or operating design.

        If Builder generated an implementation brief for you, paste it into **What do you want to ship?** and add the shared Blueprint URL below. This is a public GitHub issue. Do not include credentials, customer information, confidential commercial terms or other sensitive data.
  - type: input
    id: organisation
    attributes:
      label: Organisation or project
      placeholder: Company, institution, startup or project name
    validations:
      required: true
  - type: input
    id: blueprint
    attributes:
      label: Shared Blueballs Blueprint
      description: Optional public-safe Blueprint URL generated by Blueballs Builder.
      placeholder: https://blueballs.tech/blueprint#blueprint=...
  - type: textarea
    id: outcome
    attributes:
      label: What do you want to ship?
      placeholder: Paste your generated Blueballs implementation brief here, or describe the product and implementation outcome.
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Relevant Blueballs surfaces
      options:
        - label: Banking API and ledger
        - label: Onboarding, identity or compliance
        - label: Payments, accounts or cards
        - label: Wallets or custody
        - label: Provider adapters and orchestration
        - label: Stablecoin FX and treasury
        - label: Settlement contracts
        - label: Sandbox and product experience
        - label: Deployment, operations or hardening
  - type: input
    id: providers
    attributes:
      label: Providers or infrastructure already selected
      placeholder: Optional — only name non-confidential providers or platforms
  - type: input
    id: markets
    attributes:
      label: Target markets
      placeholder: Countries, regions or corridors
  - type: textarea
    id: timing
    attributes:
      label: Milestone and timing
      placeholder: What needs to be working, and when?
  - type: checkboxes
    id: public
    attributes:
      label: Public issue acknowledgement
      options:
        - label: I have not included secrets, customer data or confidential information.
          required: true
