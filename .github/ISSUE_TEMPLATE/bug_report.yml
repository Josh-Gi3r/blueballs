name: Bug report
description: Report reproducible incorrect behaviour
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction, including requests or scenario IDs where relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Blueballs version/commit, Node version, OS, deployment mode and relevant adapter configuration.
    validations:
      required: true
  - type: dropdown
    id: financial-impact
    attributes:
      label: Could this affect financial state?
      options: ["No", "Possibly", "Yes - balances/ledger", "Yes - settlement/liquidity", "Unknown"]
    validations:
      required: true
