name: Blueballs production verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blueballs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banking-and-contracts:
    name: Banking API, OpenAPI and product contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Banking API tests
        run: pnpm test:api

      - name: OpenAPI catalogue consistency
        run: node scripts/check-catalogue.mjs

      - name: OpenAPI request contracts
        run: node scripts/check-openapi-requests.mjs

      - name: OpenAPI response contracts
        run: node scripts/check-openapi-responses.mjs

      - name: Banking SDK generation proof
        run: node scripts/check-banking-sdk.mjs

      - name: OpenAPI lint
        run: pnpm lint:openapi

  workers:
    name: Cloudflare runtime parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Worker runtime tests
        run: pnpm test:workers

  fx-runtime:
    name: Canonical FX runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: FX package and node suites
        run: pnpm test:fx

      - name: FX SDK package boundary
        run: pnpm sdk:pack

  solidity:
    name: Solidity format, build, fuzz and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Contract release gate
        run: make -C packages/fx-contracts ci

  container:
    name: Reference container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full reference image
        run: docker build -f Dockerfile.reference -t blueballs-reference:ci .

      - name: Build FX image
        run: docker build -f apps/fx-node/Dockerfile -t blueballs-fx:ci .

      - name: Validate Compose topology
        run: docker compose -f compose.reference.yml config --quiet

  release-gate:
    name: Production gate
    if: always()
    needs: [banking-and-contracts, workers, fx-runtime, solidity, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every production check
        env:
          BANKING: ${{ needs.banking-and-contracts.result }}
          WORKERS: ${{ needs.workers.result }}
          FX: ${{ needs.fx-runtime.result }}
          SOLIDITY: ${{ needs.solidity.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          for result in "$BANKING" "$WORKERS" "$FX" "$SOLIDITY" "$CONTAINER"; do
            test "$result" = success || exit 1
          done
