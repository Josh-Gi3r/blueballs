name: FX node

on:
  push:
    branches: [fx-policy, fx-public-reference, fx-final-integration, main]
    paths:
      - 'apps/fx-node/**'
      - 'packages/fx-market/**'
      - 'packages/fx-fiat/**'
      - 'packages/fx-policy/**'
      - 'packages/fx-pricing/**'
      - 'packages/fx-liquidity/**'
      - 'scripts/dev.mjs'
      - 'Dockerfile.reference'
      - 'compose.reference.yml'
      - '.dockerignore'
      - 'spec/fx/API-RUNTIME.md'
      - 'spec/fx/PUBLIC-REFERENCE.md'
      - '.github/workflows/fx-node.yml'
  pull_request:
    paths:
      - 'apps/fx-node/**'
      - 'packages/fx-market/**'
      - 'packages/fx-fiat/**'
      - 'packages/fx-policy/**'
      - 'packages/fx-pricing/**'
      - 'packages/fx-liquidity/**'
      - 'scripts/dev.mjs'
      - 'Dockerfile.reference'
      - 'compose.reference.yml'
      - '.dockerignore'
      - 'spec/fx/API-RUNTIME.md'
      - 'spec/fx/PUBLIC-REFERENCE.md'
      - '.github/workflows/fx-node.yml'

concurrency:
  group: fx-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fx-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Syntax
        run: |
          node --check src/server.js
          node --check src/quote-coordinator.js
          node --check src/integrated-quote-coordinator.js
          node --check src/reference-liquidity.js
          node --check src/source-adapters.js
          node --check src/composite-principal-adapter.js
          node --check src/reference-runtime.js
          node --check src/reference-trade-coordinator.js
          node --check src/public-reference-runtime.js
          node --check src/cli.js

      - name: Tests
        run: node --test --test-reporter=spec test/*.test.js

      - name: OpenAPI contract present
        run: |
          grep -q '^openapi: 3.1.0' openapi.yaml
          grep -q '^  /v2/fx/quotes:' openapi.yaml
          grep -q '^  /v2/fx/reference/status:' openapi.yaml
          grep -q '^  /v2/fx/reference/trades/preview:' openapi.yaml
          grep -q '^  /v2/fx/reference/scenario:' openapi.yaml

      - name: FX node Docker build
        run: docker build -f Dockerfile -t blueballs-fx:test ../..

      - name: Complete reference image and Compose config
        run: |
          cd "$GITHUB_WORKSPACE"
          docker compose -f compose.reference.yml config >/dev/null
          docker build -f Dockerfile.reference -t blueballs-reference:test .
