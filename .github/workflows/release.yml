name: Release gate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:fx
      - run: pnpm sdk:pack
      - run: pnpm sbom
      - name: Solidity tests
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - working-directory: packages/fx-contracts
        run: forge test -vvv
      - name: Package source evidence
        run: |
          mkdir -p release-evidence
          cp THIRD_PARTY_NOTICES.md release-evidence/
          cp package.json release-evidence/
          cp pnpm-lock.yaml release-evidence/
          git rev-parse HEAD > release-evidence/SOURCE_COMMIT
          tar -czf blueballs-${GITHUB_REF_NAME}-evidence.tar.gz release-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}
          path: blueballs-${{ github.ref_name }}-evidence.tar.gz
          if-no-files-found: error
