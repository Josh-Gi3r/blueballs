name: FX simulator

on:
  push:
    branches: [fx-policy]
    paths:
      - 'packages/fx-simulator/**'
      - 'packages/fx-liquidity/**'
      - 'spec/fx/SIMULATOR.md'
      - '.github/workflows/fx-simulator.yml'
  pull_request:
    paths:
      - 'packages/fx-simulator/**'
      - 'packages/fx-liquidity/**'
      - 'spec/fx/SIMULATOR.md'
      - '.github/workflows/fx-simulator.yml'

concurrency:
  group: fx-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fx-simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Syntax
        run: |
          node --check src/simulator.js
          node --check src/scenarios.js

      - name: Economic scenarios
        run: node --test --test-reporter=spec test/*.test.js
