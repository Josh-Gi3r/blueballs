name: FX fiat

on:
  push:
    branches: [fx-policy]
    paths:
      - 'packages/fx-fiat/**'
      - 'spec/fx/FIAT-SETTLEMENT.md'
      - '.github/workflows/fx-fiat.yml'
  pull_request:
    paths:
      - 'packages/fx-fiat/**'
      - 'spec/fx/FIAT-SETTLEMENT.md'
      - '.github/workflows/fx-fiat.yml'

concurrency:
  group: fx-fiat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fiat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fx-fiat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Tests
        run: node --test --test-reporter=spec test/*.test.js
