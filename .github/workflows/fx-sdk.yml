name: FX SDK

on:
  push:
    branches: [fx-policy]
    paths:
      - 'packages/fx-sdk/**'
      - '.github/workflows/fx-sdk.yml'
  pull_request:
    paths:
      - 'packages/fx-sdk/**'
      - '.github/workflows/fx-sdk.yml'

concurrency:
  group: fx-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fx-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Tests
        run: node --test --test-reporter=spec test/*.test.js
