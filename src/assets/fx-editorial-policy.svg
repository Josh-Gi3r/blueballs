<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Policy removes ineligible liquidity before pricing</title>
  <desc id="desc">Potential FX providers pass through institution policy before joining the executable market.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F8"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0868FF"/><stop offset="1" stop-color="#40539D"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24305A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="2400" height="1350" rx="44" fill="url(#bg)"/>
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="30" letter-spacing="9" fill="#747D92">POLICY BEFORE PRICE</text>
  <text x="120" y="194" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#07144F">The best permitted price wins.</text>
  <text x="120" y="244" font-family="Arial, sans-serif" font-size="26" fill="#5B6376">A cheap quote never bypasses identity, jurisdiction, credential or ticket rules.</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(115 350)"><rect width="555" height="145" rx="26" fill="#FFFFFF" stroke="#CDD3E3" stroke-width="3"/><circle cx="50" cy="48" r="18" fill="#0A9BFF"/><text x="84" y="57" font-size="27" font-weight="700" fill="#07144F">Issuer A</text><text x="40" y="105" font-size="21" fill="#747D92">KYB passed · corridor enabled</text><text x="458" y="58" font-size="23" font-weight="700" fill="#0868FF">6.055</text></g>
    <g transform="translate(115 535)"><rect width="555" height="145" rx="26" fill="#FFFFFF" stroke="#E1B9B5" stroke-width="3"/><circle cx="50" cy="48" r="18" fill="#C76860"/><text x="84" y="57" font-size="27" font-weight="700" fill="#07144F">Provider B</text><text x="40" y="105" font-size="21" fill="#9A5A54">credential expired</text><text x="458" y="58" font-size="23" font-weight="700" fill="#B4453C">6.040</text></g>
    <g transform="translate(115 720)"><rect width="555" height="145" rx="26" fill="#FFFFFF" stroke="#CDD3E3" stroke-width="3"/><circle cx="50" cy="48" r="18" fill="#8ACBFF"/><text x="84" y="57" font-size="27" font-weight="700" fill="#07144F">LP C</text><text x="40" y="105" font-size="21" fill="#747D92">KYB passed · amount allowed</text><text x="458" y="58" font-size="23" font-weight="700" fill="#0868FF">6.082</text></g>
    <g transform="translate(115 905)"><rect width="555" height="145" rx="26" fill="#FFFFFF" stroke="#E1B9B5" stroke-width="3"/><circle cx="50" cy="48" r="18" fill="#C76860"/><text x="84" y="57" font-size="27" font-weight="700" fill="#07144F">Provider D</text><text x="40" y="105" font-size="21" fill="#9A5A54">corridor not permitted</text><text x="458" y="58" font-size="23" font-weight="700" fill="#B4453C">6.030</text></g>
  </g>
  <g transform="translate(915 345)" filter="url(#shadow)">
    <path d="M0 50 Q0 0 50 0 H520 Q570 0 570 50 V700 Q570 750 520 750 H50 Q0 750 0 700Z" fill="url(#gate)"/>
    <text x="285" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" letter-spacing="6" fill="#DCE3FF">INSTITUTION POLICY</text>
    <g font-family="Arial, sans-serif" fill="#FFFFFF"><text x="90" y="195" font-size="27" font-weight="700">01  Identity and account attribution</text><text x="90" y="285" font-size="27" font-weight="700">02  Credential and sanctions status</text><text x="90" y="375" font-size="27" font-weight="700">03  Jurisdiction and corridor rules</text><text x="90" y="465" font-size="27" font-weight="700">04  Ticket and participant limits</text><text x="90" y="555" font-size="27" font-weight="700">05  Short-lived authorisation</text></g>
    <rect x="92" y="625" width="386" height="66" rx="33" fill="#FFFFFF" opacity=".15"/><text x="285" y="667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">INVALID SOURCES STOP HERE</text>
  </g>
  <g stroke="#99A6D3" stroke-width="7" fill="none"><path d="M670 422H915"/><path d="M670 607H915" stroke="#C98B85" stroke-dasharray="14 14"/><path d="M670 792H915"/><path d="M670 977H915" stroke="#C98B85" stroke-dasharray="14 14"/><path d="M1485 515H1700"/><path d="M1485 835H1700"/></g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)"><g transform="translate(1700 440)"><rect width="580" height="190" rx="30" fill="#FFFFFF" stroke="#64B7FF" stroke-width="3"/><text x="45" y="55" font-size="20" letter-spacing="4" fill="#747D92">EXECUTABLE MARKET</text><text x="45" y="115" font-size="34" font-weight="700" fill="#07144F">Issuer A + LP C</text><text x="45" y="158" font-size="22" fill="#0868FF">now compare price and capacity</text></g><g transform="translate(1700 760)"><rect width="580" height="190" rx="30" fill="#07144F"/><text x="45" y="55" font-size="20" letter-spacing="4" fill="#AAB3C8">RESULT</text><text x="45" y="115" font-size="34" font-weight="700" fill="#FFFFFF">Issuer A selected</text><text x="45" y="158" font-size="22" fill="#C8D0EF">not the cheapest raw quote — the best permitted one</text></g></g>
</svg>
