<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">Institution-controlled FX liquidity network</title><desc id="desc">Six approved liquidity sources converge into one customer exchange.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F8"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5268B9"/><stop offset="1" stop-color="#7182C6"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24305A" flood-opacity=".12"/></filter><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#DDE2ED" stroke-width="1"/></pattern></defs>
<rect width="2400" height="1350" rx="44" fill="url(#bg)"/><rect width="2400" height="1350" rx="44" fill="url(#grid)" opacity=".35"/>
<text x="120" y="120" font-family="Arial,sans-serif" font-size="30" letter-spacing="9" fill="#747D92">ONE CUSTOMER TRADE</text><text x="120" y="194" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#14161C">The institution assembles its own market.</text><text x="120" y="244" font-family="Arial,sans-serif" font-size="26" fill="#5B6376">Only approved sources compete. Capacity is reserved before the quote becomes firm.</text>
<g stroke="#AAB4D8" stroke-width="7" fill="none" stroke-linecap="round"><path d="M620 420 C850 420 845 590 1035 620"/><path d="M620 675 C835 675 855 675 1035 675"/><path d="M620 930 C850 930 845 760 1035 730"/><path d="M1780 420 C1550 420 1555 590 1365 620"/><path d="M1780 675 C1565 675 1545 675 1365 675"/><path d="M1780 930 C1550 930 1555 760 1365 730"/></g>
<g filter="url(#shadow)"><rect x="1000" y="500" width="400" height="350" rx="42" fill="url(#core)"/><text x="1200" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#DDE4FF">CUSTOMER EXCHANGE</text><text x="1200" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#FFF">BRL → EUR</text><text x="1200" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#E6EAFF">one quote · one route</text><rect x="1112" y="790" width="176" height="34" rx="17" fill="#FFF" opacity=".15"/><text x="1200" y="814" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#FFF">RESERVED</text></g>
<g font-family="Arial,sans-serif"><g transform="translate(120 330)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#8EA0E4" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Customer liquidity</text><text x="40" y="115" font-size="22" fill="#747D92">Signed internal flow</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5268B9">available when eligible</text></g><g transform="translate(120 585)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#8EA0E4" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Stablecoin issuer</text><text x="40" y="115" font-size="22" fill="#747D92">Issuer liquidity</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5268B9">policy controlled</text></g><g transform="translate(120 840)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#8EA0E4" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Institutional LP</text><text x="40" y="115" font-size="22" fill="#747D92">External liquidity</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5268B9">reserved through adapter</text></g><g transform="translate(1780 330)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#CDD3E3" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Another institution</text><text x="40" y="115" font-size="22" fill="#747D92">Specialist inventory</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5B6376">available when competitive</text></g><g transform="translate(1780 585)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#CDD3E3" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Treasury</text><text x="40" y="115" font-size="22" fill="#747D92">Currency already held</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5B6376">capacity controlled</text></g><g transform="translate(1780 840)" filter="url(#shadow)"><rect width="500" height="180" rx="28" fill="#FFF" stroke="#CDD3E3" stroke-width="3"/><text x="40" y="62" font-size="29" font-weight="700" fill="#14161C">Balance sheet</text><text x="40" y="115" font-size="22" fill="#747D92">Principal liquidity</text><text x="40" y="150" font-size="20" font-weight="700" fill="#5B6376">hard limit enforced</text></g></g>
<g transform="translate(827 1110)"><rect width="746" height="112" rx="28" fill="#14161C"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#AEB7CF">ROUTING</text><text x="45" y="82" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFF">eligible sources → price → reserve</text></g></svg>
