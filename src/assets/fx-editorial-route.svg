<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">BRL to EUR mixed-finality route</title>
  <desc id="desc">A PIX payment, atomic token FX and issuer redemption form one customer exchange while retaining distinct finality.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F8"/></linearGradient>
    <linearGradient id="atomic" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0868FF"/><stop offset="1" stop-color="#0A9BFF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24305A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="2400" height="1350" rx="44" fill="url(#bg)"/>
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="30" letter-spacing="9" fill="#747D92">ONE CUSTOMER PRODUCT · THREE FINALITY DOMAINS</text>
  <text x="120" y="194" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#07144F">BRL in. EUR out. The plumbing stays visible.</text>
  <text x="120" y="244" font-family="Arial, sans-serif" font-size="26" fill="#5B6376">Stablecoins can carry the cross-border leg without pretending external rails are atomic.</text>
  <g stroke="#A8D8FF" stroke-width="9" fill="none" stroke-linecap="round"><path d="M430 690H760"/><path d="M1050 690H1375"/><path d="M1670 690H1990"/></g>
  <g fill="#0868FF"><path d="M744 670l28 20-28 20z"/><path d="M1359 670l28 20-28 20z"/><path d="M1974 670l28 20-28 20z"/></g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 480)"><rect width="340" height="420" rx="34" fill="#FFFFFF" stroke="#CDD3E3" stroke-width="3"/><circle cx="170" cy="95" r="48" fill="#EAF4FF"/><text x="170" y="108" text-anchor="middle" font-size="32" font-weight="700" fill="#0868FF">R$</text><text x="170" y="190" text-anchor="middle" font-size="40" font-weight="700" fill="#07144F">BRL account</text><text x="170" y="238" text-anchor="middle" font-size="22" fill="#747D92">customer starts here</text><rect x="55" y="300" width="230" height="54" rx="27" fill="#F2F3F7"/><text x="170" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#5B6376">R$50,000.00</text></g>
    <g transform="translate(760 450)"><rect width="290" height="480" rx="34" fill="#FFFFFF" stroke="#CDD3E3" stroke-width="3"/><text x="145" y="75" text-anchor="middle" font-size="20" letter-spacing="4" fill="#747D92">LEG 1</text><text x="145" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#07144F">PIX payment</text><text x="145" y="188" text-anchor="middle" font-size="23" fill="#747D92">BRL → BRLX</text><rect x="48" y="260" width="194" height="62" rx="31" fill="#F2F3F7"/><text x="145" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#5B6376">ATTESTED EXTERNAL</text><text x="145" y="380" text-anchor="middle" font-size="20" fill="#747D92">payment observed</text><text x="145" y="413" text-anchor="middle" font-size="20" fill="#747D92">then verified</text></g>
    <g transform="translate(1375 420)"><rect width="295" height="540" rx="38" fill="url(#atomic)"/><text x="148" y="78" text-anchor="middle" font-size="20" letter-spacing="4" fill="#D8EEFF">LEG 2</text><text x="148" y="145" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">Token FX</text><text x="148" y="198" text-anchor="middle" font-size="23" fill="#EAF5FF">BRLX → EURC</text><g transform="translate(50 252)"><circle cx="52" cy="52" r="52" fill="#FFFFFF" opacity=".16"/><circle cx="145" cy="52" r="52" fill="#FFFFFF" opacity=".16"/><text x="52" y="61" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">BRLX</text><text x="145" y="61" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">EURC</text><path d="M103 52h-15m30 0h-15" stroke="#FFFFFF" stroke-width="5"/></g><rect x="63" y="402" width="169" height="62" rx="31" fill="#FFFFFF" opacity=".16"/><text x="148" y="441" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">ATOMIC</text><text x="148" y="500" text-anchor="middle" font-size="18" fill="#EAF5FF">all selected fills</text><text x="148" y="526" text-anchor="middle" font-size="18" fill="#EAF5FF">succeed or revert</text></g>
    <g transform="translate(1990 450)"><rect width="290" height="480" rx="34" fill="#FFFFFF" stroke="#CDD3E3" stroke-width="3"/><text x="145" y="75" text-anchor="middle" font-size="20" letter-spacing="4" fill="#747D92">LEG 3</text><text x="145" y="135" text-anchor="middle" font-size="36" font-weight="700" fill="#07144F">Redemption</text><text x="145" y="188" text-anchor="middle" font-size="23" fill="#747D92">EURC → EUR</text><rect x="45" y="260" width="200" height="62" rx="31" fill="#F2F3F7"/><text x="145" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#5B6376">ASYNC EXTERNAL</text><text x="145" y="380" text-anchor="middle" font-size="20" fill="#747D92">issuer submits</text><text x="145" y="413" text-anchor="middle" font-size="20" fill="#747D92">EUR delivery</text></g>
  </g>
  <g transform="translate(570 1080)"><rect width="1260" height="112" rx="28" fill="#07144F"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#AEB7CF">END-TO-END GUARANTEE</text><text x="55" y="83" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">MIXED FINALITY · only the token FX leg is atomic</text></g>
</svg>
